# 项目相关配置
ruoyi:
  # 名称
  name: 管理系统
  # 版本
  version: 3.9.1
  # 版权年份
  copyrightYear: 2026
  # 文件路径 示例（ Windows配置D:/ruoyi/uploadPath，Linux配置 /home/ruoyi/uploadPath）
  profile: ${RUOYI_PROFILE:D:/ruoyi/uploadPath}
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: ${SERVER_PORT:8080}
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: ${SERVER_TOMCAT_MAX_THREADS:200}
      # Tomcat启动初始化的线程数，默认值10
      min-spare: ${SERVER_TOMCAT_MIN_SPARE_THREADS:10}

# 日志配置
logging:
  level:
    com.ruoyi: ${APP_LOG_LEVEL:info}
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: ${SPRING_DEVTOOLS_RESTART_ENABLED:false}
  # redis 配置
  redis:
    # 地址
    host: ${REDIS_HOST:localhost}
    # 端口，默认为6379
    port: ${REDIS_PORT:6379}
    # 数据库索引
    database: ${REDIS_DATABASE:0}
    # 密码
    password: ${REDIS_PASSWORD:}
    # 连接超时时间
    timeout: 10s
    lettuce:
      pool:
        # 连接池中的最小空闲连接
        min-idle: 0
        # 连接池中的最大空闲连接
        max-idle: 8
        # 连接池的最大数据库连接数
        max-active: 8
        # #连接池最大阻塞等待时间（使用负值表示没有限制）
        max-wait: -1ms

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: ${TOKEN_SECRET}
  # 令牌有效期（分钟）；0表示不自动过期，仍可手动退出或由管理员强制下线
  expireTime: ${TOKEN_EXPIRE_MINUTES:30}

# 钓虾小程序。真实密钥只能通过部署环境变量注入，严禁填写到此文件。
xy:
  order-expire-minutes: ${XY_ORDER_EXPIRE_MINUTES:30}
  # 线下待收款独立保留24小时，超时后商品单自动回补库存、开卡单自动关闭。
  offline-payment-expire-minutes: ${XY_OFFLINE_PAYMENT_EXPIRE_MINUTES:1440}
  # 防止单个会员通过多笔未付订单长期占用库存。
  member-pending-order-limit: ${XY_MEMBER_PENDING_ORDER_LIMIT:3}
  maintenance-interval-ms: ${XY_MAINTENANCE_INTERVAL_MS:60000}
  wechat:
    app-id: ${XY_WECHAT_APP_ID:}
    app-secret: ${XY_WECHAT_APP_SECRET:}
    subscribe-reservation-template-id: ${XY_WECHAT_SUBSCRIBE_RESERVATION_TEMPLATE_ID:}
    subscribe-reservation-page: ${XY_WECHAT_SUBSCRIBE_RESERVATION_PAGE:pages/reserve/history}
    subscribe-reservation-title-field: ${XY_WECHAT_SUBSCRIBE_RESERVATION_TITLE_FIELD:thing1}
    subscribe-reservation-time-field: ${XY_WECHAT_SUBSCRIBE_RESERVATION_TIME_FIELD:time2}
    subscribe-benefit-start-template-id: ${XY_WECHAT_SUBSCRIBE_BENEFIT_START_TEMPLATE_ID:}
    subscribe-benefit-cancel-template-id: ${XY_WECHAT_SUBSCRIBE_BENEFIT_CANCEL_TEMPLATE_ID:}
    subscribe-benefit-page: ${XY_WECHAT_SUBSCRIBE_BENEFIT_PAGE:pages/benefit/history}
    subscribe-benefit-title-field: ${XY_WECHAT_SUBSCRIBE_BENEFIT_TITLE_FIELD:thing1}
    subscribe-benefit-time-field: ${XY_WECHAT_SUBSCRIBE_BENEFIT_TIME_FIELD:time2}
    subscribe-benefit-note-field: ${XY_WECHAT_SUBSCRIBE_BENEFIT_NOTE_FIELD:thing3}
  wechat-pay:
    demo-enabled: ${XY_WECHAT_PAY_DEMO_ENABLED:false}
    mch-id: ${XY_WECHAT_PAY_MCH_ID:}
    merchant-serial-no: ${XY_WECHAT_PAY_SERIAL_NO:}
    private-key-path: ${XY_WECHAT_PAY_PRIVATE_KEY_PATH:}
    notify-url: ${XY_WECHAT_PAY_NOTIFY_URL:}
    refund-notify-url: ${XY_WECHAT_PAY_REFUND_NOTIFY_URL:}
    app-id: ${XY_WECHAT_APP_ID:}
    api-v3-key: ${XY_WECHAT_PAY_API_V3_KEY:}
    platform-certificate-path: ${XY_WECHAT_PAY_PLATFORM_CERT_PATH:}
    public-key-id: ${XY_WECHAT_PAY_PUBLIC_KEY_ID:}
    public-key-path: ${XY_WECHAT_PAY_PUBLIC_KEY_PATH:}

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.ruoyi.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Swagger配置
swagger:
  # 是否开启swagger
  enabled: ${SWAGGER_ENABLED:false}
  # 请求前缀
  pathMapping: /dev-api

# 防盗链配置
referer:
  # 防盗链开关
  enabled: ${REFERER_ENABLED:false}
  # 允许的域名列表
  allowed-domains: ${REFERER_ALLOWED_DOMAINS:localhost,127.0.0.1}

# 浏览器管理端跨域白名单，多个地址用英文逗号分隔。
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:80,http://127.0.0.1:80,http://localhost:5173,http://127.0.0.1:5173}

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*
