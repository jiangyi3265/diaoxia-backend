name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: diaoxia-backend-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: diaoxia
          MYSQL_USER: diaoxia_app
          MYSQL_PASSWORD: ci-db-password
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password --silent"
          --health-interval=10s --health-timeout=5s --health-retries=12
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      DB_URL: jdbc:mysql://127.0.0.1:3306/diaoxia?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia%2FShanghai&allowPublicKeyRetrieval=true
      DB_USERNAME: diaoxia_app
      DB_PASSWORD: ci-db-password
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      TOKEN_SECRET: ci-only-token-secret-must-never-be-used-in-production
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      RUN_XY_INTEGRATION_TESTS: 'true'
      LOG_PATH: /tmp/diaoxia-test-logs
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Initialise isolated business database
        run: |
          mysql -h 127.0.0.1 -uroot -pci-root-password diaoxia < sql/ry_20250522.sql
          mysql -h 127.0.0.1 -uroot -pci-root-password diaoxia < sql/xy_business.sql

      - name: Build and test
        run: |
          mvn -B clean package
          rm -rf build/deploy
          mkdir -p build/deploy
          cd build/deploy
          jar -xf ../../ruoyi-admin/target/ruoyi-admin.jar
          tar -czf ../diaoxia-backend-app.tgz BOOT-INF/classes META-INF BOOT-INF/lib/ruoyi-*.jar
          tar --exclude='BOOT-INF/lib/ruoyi-*.jar' -czf ../diaoxia-backend-lib.tgz BOOT-INF/lib
          python3 - <<'PY'
          import hashlib
          from pathlib import Path

          digest = hashlib.sha256()
          paths = (path for path in Path('BOOT-INF/lib').glob('*.jar')
                   if not path.name.startswith('ruoyi-'))
          for path in sorted(paths, key=lambda item: item.name.lower()):
              digest.update(path.name.encode('utf-8'))
              digest.update(b'\0')
              with path.open('rb') as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b''):
                      digest.update(chunk)
          Path('../dependency.sha256').write_text(digest.hexdigest() + '\n', encoding='ascii')
          PY

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Upload changed layers and activate backend
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          local_hash="$(cat build/dependency.sha256)"
          remote_hash="$(ssh -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            'cat /home/deploy/releases/backend-dependency.sha256 2>/dev/null || true')"

          scp -o BatchMode=yes build/diaoxia-backend-app.tgz \
            "$DEPLOY_USER@$DEPLOY_HOST:/home/deploy/releases/diaoxia-backend-app.tgz.upload"
          scp -o BatchMode=yes build/dependency.sha256 \
            "$DEPLOY_USER@$DEPLOY_HOST:/home/deploy/releases/dependency.sha256.upload"

          if [ "$local_hash" != "$remote_hash" ]; then
            scp -o BatchMode=yes build/diaoxia-backend-lib.tgz \
              "$DEPLOY_USER@$DEPLOY_HOST:/home/deploy/releases/diaoxia-backend-lib.tgz.upload"
          else
            ssh -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" \
              'rm -f /home/deploy/releases/diaoxia-backend-lib.tgz.upload /home/deploy/releases/diaoxia-backend-lib.tgz'
          fi

          ssh -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            'mv /home/deploy/releases/diaoxia-backend-app.tgz.upload /home/deploy/releases/diaoxia-backend-app.tgz && mv /home/deploy/releases/dependency.sha256.upload /home/deploy/releases/dependency.sha256 && if [ -f /home/deploy/releases/diaoxia-backend-lib.tgz.upload ]; then mv /home/deploy/releases/diaoxia-backend-lib.tgz.upload /home/deploy/releases/diaoxia-backend-lib.tgz; fi && sudo /usr/local/sbin/deploy-diaoxia-backend'
