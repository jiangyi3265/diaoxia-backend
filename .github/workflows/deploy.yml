name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: diaoxia-backend-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test
        run: mvn -B clean package

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Upload and activate backend
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          scp -o BatchMode=yes ruoyi-admin/target/ruoyi-admin.jar \
            "$DEPLOY_USER@$DEPLOY_HOST:/home/deploy/releases/diaoxia-backend.jar.upload"
          ssh -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "mv /home/deploy/releases/diaoxia-backend.jar.upload /home/deploy/releases/diaoxia-backend.jar && sudo /usr/local/sbin/deploy-diaoxia-backend"
